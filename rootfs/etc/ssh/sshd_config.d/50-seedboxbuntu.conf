# SeedBoxBuntu : durcissement SSH (vérifié par sshd -t ; retiré automatiquement s'il est refusé)
PermitRootLogin no
PermitEmptyPasswords no
MaxAuthTries 4
MaxSessions 6
LoginGraceTime 30
LogLevel VERBOSE
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitUserEnvironment no
ClientAliveInterval 300
ClientAliveCountMax 2
