<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{{status}} - SeedBoxBuntu</title>
<meta name="theme-color" content="#020617">
<link rel="icon" type="image/svg+xml" href="/invite/static/logo.svg">
<link rel="stylesheet" href="/invite/static/tokens.css">
<link rel="stylesheet" href="/invite/static/app.css">
<script src="/invite/static/display.js"></script>
</head>
<body>
<main class="invite">
  <div class="brand"><img src="/invite/static/logo.svg" alt="" width="34" height="34"><span class="brand-name">SeedBox<b>Buntu</b></span></div>
  <div class="card">
    <h2>Erreur {{status}}</h2>
    <p><strong>{{title}}</strong></p>
    <p class="muted">{{text}}</p>
    <p class="row"><a class="btn primary" href="">Réessayer</a><a class="btn" href="/">Tableau de bord</a></p>
  </div>
</main>
</body>
</html>
