name: SeedBoxBuntu

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dépendances
        run: pip install pyyaml
      # Contrôles statiques, puis tests unitaires, dont la mise à jour N-1 -> N (sans Docker)
      - name: Tests
        run: tests/run.sh
