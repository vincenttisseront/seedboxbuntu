name: SeedBoxBuntu

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dépendances
        run: |
          pip install pyyaml playwright pillow cryptography
          npm install --no-save axe-core@4.10.2
          playwright install --with-deps chromium
      # Contrôles statiques, puis tests unitaires, dont la mise à jour N-1 -> N (sans Docker)
      # En root : les tests écrivent dans des arborescences de serveur (chown, /etc), ce qu'un compte ordinaire refuse (PermissionError)
      - name: Tests
        run: sudo -E env "HOME=$HOME" "PATH=$PATH" tests/run.sh
        env:
          # Les captures de référence viennent d'un autre poste : en CI, seuls les contrôles de comportement,
          # de contraste et de classes s'appliquent (voir tests/visual_test.py)
          VISUAL_COMPARE: "off"
