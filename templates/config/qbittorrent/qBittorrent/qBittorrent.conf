[AutoRun]
enabled=false
program=

[BitTorrent]
Session\DefaultSavePath=/data/downloads
Session\DisableAutoTMMByDefault=false
Session\Port=6881
Session\Interface=tun0
Session\InterfaceName=tun0
Session\BTProtocol=TCP
Session\AnnounceToAllTrackers=true
Session\AnnounceToAllTiers=true
Session\ReannounceWhenAddressChanged=true
Session\MaxConcurrentHTTPAnnounces=100
Session\QueueingSystemEnabled=false
Session\GlobalMaxRatio=-1
Session\GlobalMaxSeedingMinutes=-1
Session\MaxConnections=4000
Session\MaxConnectionsPerTorrent=300
Session\MaxUploads=-1
Session\MaxUploadsPerTorrent=-1
Session\ChokingAlgorithm=RateBased
Session\SeedChokingAlgorithm=FastestUpload
Session\ConnectionSpeed=200
Session\SocketBacklogSize=2048
Session\SendBufferWatermark=20480
Session\SendBufferLowWatermark=5120
Session\SendBufferWatermarkFactor=200
Session\SuggestMode=true
Session\AsyncIOThreadsCount=16
Session\HashingThreadsCount=2
Session\FilePoolSize=5000
Session\DiskQueueSize=268435456
Session\Preallocation=true
Session\LSDEnabled=false
Session\AnonymousModeEnabled=false
Session\MultiConnectionsPerIp=false

[LegalNotice]
Accepted=true

[Preferences]
Connection\UPnP=false
General\Locale=fr
WebUI\Address=*
WebUI\ServerDomains=*
WebUI\Username=@@QBIT_USERNAME@@
WebUI\Password_PBKDF2="@ByteArray(@@QBIT_PBKDF2@@)"
WebUI\LocalHostAuth=false
WebUI\AuthSubnetWhitelistEnabled=true
WebUI\AuthSubnetWhitelist=172.30.0.2/32
WebUI\MaxAuthenticationFailCount=5
WebUI\BanDuration=1800
WebUI\SessionTimeout=3600
