---
# =============================================================================
#  SeedBoxBuntu - services de Homepage
# =============================================================================
#  COMMENT HOMEPAGE COMMUNIQUE AVEC LA STACK
#
#    navigateur ──> Traefik ──> homepage:3000 ──> radarr:7878, qbittorrent:8080...
#                                (serveur)         (réseau Docker « seedbox »)
#
#  Le navigateur ne parle qu'à Homepage. Le serveur Homepage relit ce fichier, remplace
#  les {{HOMEPAGE_VAR_*}} par ses variables d'environnement, puis interroge lui-même
#  les applications : clés et mots de passe ne quittent jamais le serveur.
#
#    href         ouvert par le NAVIGATEUR -> chemin relatif (/sonarr/) : l'adresse saisie
#                                            par l'utilisateur est conservée ; port dédié
#                                            pour Seerr, Dockge et p2p-aggregator
#    widget.url   appelé par HOMEPAGE      -> nom Docker + port interne + chemin de base
#    siteMonitor  appelé par HOMEPAGE      -> nom Docker + port interne + chemin de base
#
#  qBittorrent : qbittorrent:8080 en mode direct ; en mode VPN il partage la pile réseau de
#  gluetun et son adresse devient gluetun:8080 (@@QBIT_HOST@@, rempli par seedboxctl).
# =============================================================================

- Téléchargement:
    - qBittorrent:
        icon: qbittorrent.png
        href: "/qbittorrent/"
        description: Client torrent routé par le VPN
        siteMonitor: http://@@QBIT_HOST@@:8080
        widget:
          type: qbittorrent
          url: http://@@QBIT_HOST@@:8080
          username: "{{HOMEPAGE_VAR_QBIT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBIT_PASSWORD}}"
          fields: ["leech", "download", "seed", "upload"]
          enableLeechProgress: true
    - P2P Aggregator:
        icon: mdi-transit-connection-variant
        href: "https://{{HOMEPAGE_VAR_DOMAIN}}:3000/"
        description: Releases et ratios multi-trackers
        siteMonitor: http://p2p-aggregator:3000/api/health
    - Prowlarr:
        icon: prowlarr.png
        href: "/prowlarr/"
        description: Indexeurs, synchronisés vers Radarr et Sonarr
        siteMonitor: http://prowlarr:9696/prowlarr/ping
        widget:
          type: prowlarr
          url: http://prowlarr:9696/prowlarr
          key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"
    - Jackett:
        icon: jackett.png
        href: "/jackett/"
        description: Indexeurs Torznab, repris par Prowlarr
        siteMonitor: http://jackett:9117/jackett/UI/Dashboard
        widget:
          type: jackett
          url: http://jackett:9117/jackett
          key: "{{HOMEPAGE_VAR_JACKETT_API_KEY}}"
    - FlareSolverr:
        icon: flaresolverr.png
        href: "/jackett/"
        description: Contourne Cloudflare pour Jackett et Prowlarr
        siteMonitor: http://flaresolverr:8191/health
    - qbit_manage:
        icon: qbittorrent.png
        href: "/qbm/"
        description: Règles de seed par tracker
        siteMonitor: http://qbit-manage:8181/qbm/api/health
    - autobrr:
        icon: autobrr.png
        href: "/autobrr/"
        description: Annonces IRC des trackers
        siteMonitor: http://autobrr:7474/autobrr/api/healthz/liveness

- Médias:
    - Jellyfin:
        icon: jellyfin.png
        href: "/jellyfin/"
        description: Serveur multimédia
        siteMonitor: http://jellyfin:8096/jellyfin/health
        widget:
          type: jellyfin
          url: http://jellyfin:8096/jellyfin
          key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
          version: 2
          enableBlocks: true
          enableNowPlaying: true
    - Seerr:
        icon: seerr.png
        href: "https://{{HOMEPAGE_VAR_DOMAIN}}:5055/"
        description: Demandes de films et séries
        siteMonitor: http://seerr:5055/api/v1/status
        widget:
          type: seerr
          url: http://seerr:5055
          key: "{{HOMEPAGE_VAR_SEERR_API_KEY}}"
    - Radarr:
        icon: radarr.png
        href: "/radarr/"
        description: Films
        siteMonitor: http://radarr:7878/radarr/ping
        widget:
          type: radarr
          url: http://radarr:7878/radarr
          key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
          fields: ["wanted", "missing", "queued", "movies"]
    - Sonarr:
        icon: sonarr.png
        href: "/sonarr/"
        description: Séries
        siteMonitor: http://sonarr:8989/sonarr/ping
        widget:
          type: sonarr
          url: http://sonarr:8989/sonarr
          key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
          fields: ["wanted", "queued", "series"]
    # Les sorties à venir viennent du widget calendar, qui réutilise les deux services
    # ci-dessus : service_group et service_name doivent reprendre exactement leurs noms.
    - Sorties à venir:
        icon: mdi-calendar-month
        widget:
          type: calendar
          view: agenda
          firstDayInWeek: monday
          maxEvents: 10
          integrations:
            - type: radarr
              service_group: Médias
              service_name: Radarr
            - type: sonarr
              service_group: Médias
              service_name: Sonarr

- Administration:
    - Console:
        icon: mdi-console
        href: "/console/"
        description: Comptes, VPN, adresse, partages, trackers et mises à jour
    - Dockge:
        icon: dockge.png
        href: "https://{{HOMEPAGE_VAR_DOMAIN}}:5001/"
        description: Déploiement de stacks Docker
        siteMonitor: http://dockge:5001
    - Traefik:
        icon: traefik.png
        href: "/traefik/dashboard/"
        description: Routes et certificats
@@EXTRA_SERVICES@@
